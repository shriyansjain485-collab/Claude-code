<title>Lifetimes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: playful game shell — hero card (portrait, money, stat meters), journal feed of years, chunky dock with a big Age button; sidebar on wide screens */
:root{
  --bg:#EAF2FB; --panel:#FFFFFF; --panel2:#F3F7FC; --ink:#18213D; --muted:#66718F; --line:#DCE5F1;
  --blue:#3D7BFD; --blue-d:#2A5FD6; --orange:#FF8A1F; --orange-d:#D96A00; --ink-btn:#FFFFFF;
  --good:#1FAA75; --warn:#EE9B12; --bad:#EA4B4B;
  --c-blue:#3D7BFD; --c-green:#1FAA75; --c-pink:#EC4F96; --c-purple:#8B5CF6; --c-orange:#FF8A1F; --c-red:#EA4B4B; --c-teal:#0FB2C2; --c-gold:#D9A10F;
  --overlay:rgba(16,24,48,.5); --shadow:0 2px 0 rgba(24,33,61,.06),0 14px 30px -18px rgba(24,33,61,.35);
  --display:"Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1326; --panel:#172039; --panel2:#111a31; --ink:#EAF0FF; --muted:#97A3C4; --line:#28345A;
  --blue:#6B9BFF; --blue-d:#4370D6; --orange:#FF9A3C; --orange-d:#C9660C; --ink-btn:#0D1326;
  --good:#3BD495; --warn:#F5B544; --bad:#FF6B6B;
  --c-blue:#6B9BFF; --c-green:#3BD495; --c-pink:#FF74B1; --c-purple:#A78BFA; --c-orange:#FF9A3C; --c-red:#FF6B6B; --c-teal:#3DD6E3; --c-gold:#F2C14E;
  --overlay:rgba(0,0,0,.62); --shadow:0 2px 0 rgba(0,0,0,.25),0 14px 30px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1326; --panel:#172039; --panel2:#111a31; --ink:#EAF0FF; --muted:#97A3C4; --line:#28345A;
  --blue:#6B9BFF; --blue-d:#4370D6; --orange:#FF9A3C; --orange-d:#C9660C; --ink-btn:#0D1326;
  --good:#3BD495; --warn:#F5B544; --bad:#FF6B6B;
  --c-blue:#6B9BFF; --c-green:#3BD495; --c-pink:#FF74B1; --c-purple:#A78BFA; --c-orange:#FF9A3C; --c-red:#FF6B6B; --c-teal:#3DD6E3; --c-gold:#F2C14E;
  --overlay:rgba(0,0,0,.62); --shadow:0 2px 0 rgba(0,0,0,.25),0 14px 30px -18px rgba(0,0,0,.8); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c-blue{--c:var(--c-blue)}.c-green{--c:var(--c-green)}.c-pink{--c:var(--c-pink)}.c-purple{--c:var(--c-purple)}.c-orange{--c:var(--c-orange)}.c-red{--c:var(--c-red)}.c-teal{--c:var(--c-teal)}.c-gold{--c:var(--c-gold)}
.ico{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.ico svg{width:21px;height:21px}
#app{max-width:620px;margin:0 auto;height:100%;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head" "log" "nav";column-gap:24px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
/* hero */
.hero{grid-area:head;margin-top:12px;background:var(--panel);border-radius:26px;padding:14px 14px 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero-top{display:flex;align-items:center;gap:12px}
.portrait{position:relative;flex:none}
.face{width:66px;height:66px;border-radius:22px;background:color-mix(in srgb,var(--blue) 14%,var(--panel));overflow:hidden}
.face svg{display:block;width:100%;height:100%;stroke:none}
.face.dead{filter:grayscale(1);opacity:.7}
.agebadge{position:absolute;right:-7px;bottom:-7px;min-width:30px;height:30px;padding:0 7px;border-radius:15px;background:var(--orange);color:#fff;
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;border:3px solid var(--panel)}
.who{min-width:0;flex:1}
.who h1{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who p{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tags:empty{display:none}
.tag{font-size:11.5px;font-weight:800;padding:1px 9px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.tag.royal{color:var(--c-gold);background:color-mix(in srgb,var(--c-gold) 14%,transparent)}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.tag.fame{color:var(--c-pink);background:color-mix(in srgb,var(--c-pink) 12%,transparent)}
.money{text-align:right;flex:none}
.money b{display:block;font-family:var(--display);font-size:21px;font-weight:800;line-height:1.1;color:var(--good)}
.money b.neg{color:var(--bad)}
.money small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{min-width:0}
.stat .sl{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.stat .sl svg{width:14px;height:14px;flex:none}
.stat .sl b{margin-left:auto;color:var(--ink);font-size:13px;letter-spacing:0}
.bar{height:9px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-top:4px;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;border-radius:5px;transition:width .5s}
/* toolbar */
.toolbar{grid-area:tools;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:10px 4px}
.tbtn{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 6px;font-weight:800;font-size:13px;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.tbtn svg{width:16px;height:16px}
.tbtn:hover{border-color:var(--blue);color:var(--blue)}
.tbtn:active{transform:translateY(2px);box-shadow:none}
.tbtn.god{color:var(--c-gold)}
/* journal */
#log{grid-area:log;overflow-y:auto;min-height:0;padding:10px 2px 18px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){#log{scroll-behavior:auto}}
.yr{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding:5px 0}
.yr .age{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.yr .age b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.yr .age small{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.yr .lines{display:flex;flex-direction:column;gap:5px;min-width:0}
.yr .lines p{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:600}
.yr .lines p.good{background:color-mix(in srgb,var(--good) 11%,var(--panel));border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.yr .lines p.bad{background:color-mix(in srgb,var(--bad) 9%,var(--panel));border-color:color-mix(in srgb,var(--bad) 28%,var(--line))}
.yr.quiet{padding:2px 0}
.yr.quiet .age b{width:30px;height:30px;font-size:11px;border-style:dashed;margin:0 4px}
.yr.quiet .lines p{background:none;border:none;color:var(--muted);font-style:italic;font-weight:600;padding:6px 4px}
.yr.now .age b{background:var(--orange);border-color:var(--orange);color:#fff}
.yr.now .lines p{animation:pop .35s ease-out backwards}
.yr.now .lines p:nth-child(2){animation-delay:.06s}.yr.now .lines p:nth-child(3){animation-delay:.12s}.yr.now .lines p:nth-child(4){animation-delay:.18s}
.yr.now .lines p.hint{background:none;border:1px dashed var(--line);color:var(--muted);font-weight:600}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
/* sidebar */
.side{grid-area:side;display:none}
.side h2{font-family:var(--display);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 4px 6px}
.glance{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 14px}
.glance div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.glance div:last-child{border-bottom:none}
.glance span:first-child{color:var(--muted);font-weight:700}
.glance span:last-child{text-align:right;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* dock */
nav{grid-area:nav;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:2px;margin-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:8px 6px;box-shadow:var(--shadow)}
nav button{background:none;border:none;border-radius:16px;padding:2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted)}
nav button .ico{width:42px;height:38px;border-radius:13px}
nav button:hover:not(:disabled){color:var(--ink)}
nav button:hover:not(:disabled) .ico{background:color-mix(in srgb,var(--c) 24%,transparent)}
nav button.age{justify-self:center;width:78px;height:78px;margin-top:-34px;border-radius:50%;background:var(--orange);color:#fff;gap:0;justify-content:center;
  border:4px solid var(--panel);box-shadow:0 5px 0 var(--orange-d),0 14px 24px -8px var(--orange);transition:transform .08s}
nav button.age b{font-family:var(--display);font-size:26px;font-weight:800;line-height:.9}
nav button.age small{font-size:11.5px;font-weight:800;opacity:.95}
nav button.age:hover:not(:disabled){color:#fff;transform:translateY(-1px)}
nav button.age:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--orange-d)}
nav button:disabled{opacity:.4;cursor:not-allowed}
/* sheets */
#ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#ov.center{align-items:center;padding:16px}
.sheet{background:var(--bg);width:100%;max-width:580px;max-height:90%;display:flex;flex-direction:column;border-radius:28px 28px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out;box-shadow:var(--shadow)}
.sheet.event{background:var(--panel);border-radius:28px;max-width:440px;padding-bottom:0;animation:zoom .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@keyframes zoom{from{transform:scale(.88);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.event,.yr.now .lines p,#toast{animation:none}.bar i{transition:none}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex:none}
.sheet.event .grab{display:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:8px 18px 8px;flex:none}
.sheet-h h2{margin:0;flex:1;min-width:0;font-family:var(--display);font-size:25px;font-weight:800;line-height:1.15;text-wrap:balance}
.sheet.event .sheet-h{padding-top:20px;justify-content:center;text-align:center}
.sheet.event .sheet-h h2{font-size:24px}
.sheet-h .x,.sheet-h .back{border:1px solid var(--line);background:var(--panel);border-radius:50%;width:38px;height:38px;font-size:22px;line-height:1;flex:none;font-weight:700;box-shadow:0 2px 0 var(--line)}
.sheet-h .x:hover,.sheet-h .back:hover{border-color:var(--blue);color:var(--blue)}
.sheet-b{overflow-y:auto;padding:4px 16px 22px}
.sub{color:var(--muted);font-size:14px;font-weight:600;margin:4px 2px 12px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:8px;box-shadow:0 2px 0 var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 12px}
.item:last-child{border-bottom:none}
.item:hover:not(:disabled){background:color-mix(in srgb,var(--blue) 7%,var(--panel))}
.item:active:not(:disabled){background:color-mix(in srgb,var(--blue) 13%,var(--panel))}
.item:disabled{cursor:not-allowed}
.item:disabled>*{opacity:.45}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:800;line-height:1.25}
.item .t span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.item .r{font-weight:800;font-size:14px;color:var(--ink);text-align:right;flex:none}
.item .arrow{color:var(--muted);font-size:20px;font-weight:700}
.sec{margin:16px 4px 7px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.ev-ico{width:64px;height:64px;border-radius:22px;margin:0 auto 6px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.ev-ico svg{width:32px;height:32px}
.event-tag{display:block;text-align:center;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.event-text{font-size:17px;line-height:1.5;margin:8px 4px 18px;text-align:center;font-weight:600}
.choices{display:flex;flex-direction:column;gap:9px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 16px;font-weight:800;font-size:15.5px;text-align:center;width:100%;
  box-shadow:0 4px 0 var(--line);transition:transform .06s}
.btn:hover:not(:disabled){border-color:var(--blue);box-shadow:0 4px 0 var(--blue-d);color:var(--blue)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.5}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--ink-btn);box-shadow:0 4px 0 var(--blue-d)}
.btn.primary:hover:not(:disabled){color:var(--ink-btn)}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;font:inherit;font-weight:700;color:var(--ink)}
.field input:focus,.field select:focus{border-color:var(--blue);outline:none}
.field input[type=range]{padding:0;border:none;background:none;accent-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);margin-left:6px;vertical-align:middle}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.mini{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:6px;max-width:180px;box-shadow:inset 0 0 0 1px var(--line)}
.mini i{display:block;height:100%}
.kv{display:grid;grid-template-columns:1fr auto;gap:0 12px;font-size:14.5px;margin:6px 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 14px}
.kv span{padding:8px 0;border-bottom:1px solid var(--line)}
.kv span:nth-last-child(-n+2){border-bottom:none}
.kv span:nth-child(odd){color:var(--muted);font-weight:700}
.kv span:nth-child(even){text-align:right;font-weight:800}
.auclog{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 14px;margin:0 0 10px;font-size:14px;font-weight:600}
.auclog p{margin:5px 0}
.auclog p:last-child{font-weight:800;color:var(--orange)}
.tomb{text-align:center}
.tomb .face{margin:0 auto 6px;width:84px;height:84px;border-radius:28px}
.tomb h3{margin:0;font-family:var(--display);font-size:22px;font-weight:800}
.tomb .years{margin:0;color:var(--muted);font-weight:800}
.ribbon{display:inline-block;margin:6px 0 0;padding:4px 16px;border-radius:999px;background:var(--orange);color:#fff;font-family:var(--display);font-weight:800;font-size:19px;box-shadow:0 3px 0 var(--orange-d)}
#toast{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:14.5px;font-weight:700;box-shadow:var(--shadow);
  width:max-content;max-width:min(90vw,440px);text-align:center;animation:toast .25s ease-out}
#ov:not([hidden])~#toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
@keyframes toast{from{transform:translate(-50%,12px);opacity:0}}
@media (max-width:420px){.row2{grid-template-columns:1fr}.who h1{font-size:20px}.money b{font-size:18px}.stats{gap:8px}.stat .sl span{display:none}.tbtn{font-size:12.5px;gap:4px;padding:8px 4px}}
@media (min-width:700px){#ov{align-items:center;padding:16px}.sheet{border-radius:28px;max-height:84%}.grab{display:none}.sheet-h{padding-top:18px}}
@media (min-width:960px){
  #app{max-width:1140px;grid-template-columns:370px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"head log" "side log" "side nav"}
  .side{display:block;overflow-y:auto;min-height:0;padding-bottom:14px}
  .stats{grid-template-columns:1fr 1fr;gap:10px 16px}
  #log{padding-top:16px}
  nav{margin-top:6px}
}

/* ---------- phase 4 ---------- */
.hero{position:relative}
.menubtn{flex:none;align-self:flex-start;width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;box-shadow:0 2px 0 var(--line)}
.menubtn svg{width:20px;height:20px}
.menubtn:hover{border-color:var(--blue);color:var(--blue)}
.wealth{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:8px;margin-top:12px}
.wealth>div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px 12px;min-width:0}
.wealth>div>span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wealth b{display:block;font-family:var(--display);font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-nw b{font-size:24px;color:var(--good)}
.w-cash b{font-size:17px;color:var(--ink)}
.wealth b.neg{color:var(--bad)}
.stat .delta{font-size:11px;font-weight:800;margin-left:3px}
.stat .delta.up{color:var(--good)}.stat .delta.down{color:var(--bad)}
.amt{font-weight:800;border-bottom:1px dotted currentColor;cursor:help}
.amt.up{color:var(--good)}.amt.down{color:var(--bad)}
#log{padding-top:0}
.yr{display:block;padding:0 0 6px}
.yh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 2px 6px;background:var(--bg)}
.yh b{font-family:var(--display);font-weight:800;font-size:15px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:1px 12px;color:var(--ink)}
.yh small{font-weight:800;color:var(--muted);font-size:12px}
.yr.now .yh b{background:var(--orange);border-color:var(--orange);color:#fff}
.yr .lines{display:flex;flex-direction:column;gap:5px}
.yr .lines p{display:flex;align-items:flex-start;gap:9px}
.yr .lines p .li{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);margin-top:1px}
.yr .lines p .li svg{width:14px;height:14px}
.yr .lines p .lt{flex:1;min-width:0}
.yr .lines p .x{flex:none;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--panel2);color:var(--muted);align-self:center}

function newLife(o={}){
  const g=o.g||(C(.5)?'M':'F'), last=o.last||P(LAST);
  const royal=!!o.royal;
  S={name:(o.first||fname(g))+' '+last,last,g,age:0,alive:true,country:royal?P(KINGDOMS):(o.country||P(COUNTRIES)),
    money:0,stats:{happy:R(60,100),health:R(70,100),smarts:R(15,100),looks:R(15,100)},karma:R(40,70),
    fame:0,followers:0,log:[],edu:{level:0,school:null,degrees:[],major:null,grades:R(40,80),dropped:false},
    job:null,part:null,people:[],assets:[],biz:[],pets:[],invest:0,record:0,jail:0,ill:[],
    royal:royal?{title:g==='M'?'Prince':'Princess',monarch:false,pop:R(50,80)}:null,
    look:{skin:R(0,5),hair:R(0,5),shirt:R(0,5)},seen:{},year0:o.year0||2026,gang:null,gen:o.gen||1,snaps:[],acts:{},flags:{},born:o.born||'',history:o.history||[]};
  if(o.stats)Object.assign(S.stats,o.stats);
  const mom=person('Mother',R(19,38),'F',last), dad=person('Father',R(20,42),'M',last);
  if(royal){(C(.5)?mom:dad).rel+=' (Monarch)';mom.money=dad.money=5e7}
  S.people.push(mom,dad);
  for(let i=0,n=R(0,2);i<n;i++){const sg=C(.5)?'M':'F';S.people.push(person(sg==='M'?'Brother':'Sister',R(1,10),sg,last))}
  if(o.people)S.people=o.people;
  if(o.money)S.money=o.money;
  S.log=[{age:0,lines:[]}];
  L(`I was born a ${g==='M'?'boy':'girl'} in ${S.country}. My name is ${S.name}.`);
  if(royal)L(`I was born into the royal house of ${S.country} as ${S.royal.title} ${S.name.split(' ')[0]}.`,'good');
  const m=S.people.find(p=>p.rel.startsWith('Mother')),f=S.people.find(p=>p.rel.startsWith('Father'));
  if(m&&f&&!o.people)L(`My mother is ${m.name} (${m.age}) and my father is ${f.name} (${f.age}).`);
  LEG.initLife(o);migrate();S.ys=yearSnap();snap();save();render();
}

function stage(){
  const a=S.age;
  if(S.jail>0)return `Inmate · ${S.jail} yr${S.jail>1?'s':''} left`;
  if(S.royal&&S.royal.monarch)return `${he()?'King':'Queen'} of ${S.country}`;
  if(S.job)return S.job.title;
  if(S.sp)return spTitle();
  if(S.part)return S.part.title+' (part-time)';
  if(S.edu.school)return S.edu.school.type==='uni'?`${S.edu.school.major} student`:`${S.edu.school.major} student (graduate)`;
  if(a<5)return a<2?'Baby':'Toddler';
  if(a<18&&!S.edu.dropped)return a<11?'Primary school':a<14?'Middle school':'High school';
  if(S.age>=60&&S.flags.pension)return 'Retired';
  if(S.age>=65)return 'Retired';
  return 'Unemployed';
}

const DOWN_WORDS=/(paid|pay |lost|lose|cost|spent|owed|owe |fine|tax|debt|stole|took |bill|fee|settle|repair|embezzl|scam|damag|bail|bribe|tuition|living costs)/i;
const UP_WORDS=/(earned|won |gained|made|inherited|received|collected|brought in|refund|profit|paid me|gave me|sold|dividend|interest|bonus|prize|left me|cashed|worth)/i;
function richify(root,log){if(!root)return;
  root.querySelectorAll('[title]').forEach(el=>{const t=el.getAttribute('title');if(t&&t.includes(''))el.setAttribute('title',FMT.fullText(t))});
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.includes('')?1:2});const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const txt=n.nodeValue,frag=document.createDocumentFragment();let last=0;const line=log&&n.parentElement.closest('.lines p');
    txt.replace(FMT.RE,(m,a,val,off)=>{frag.append(txt.slice(last,off));const sp=document.createElement('span');sp.className='amt';sp.textContent=a;const isM=a.includes('$');sp.title=FMT.full(+val,isM);sp.dataset.full=sp.title;
      if(line&&isM){const before=txt.slice(Math.max(0,off-60),off);const dir=+val<0?'down':line.classList.contains('bad')?'down':line.classList.contains('good')?'up':DOWN_WORDS.test(before)?'down':UP_WORDS.test(before)?'up':'';if(dir)sp.classList.add(dir)}
      frag.append(sp);last=off+m.length;return m});
    frag.append(txt.slice(last));n.replaceWith(frag)})}

// Merge repeated lines in a year into one with a count and a total.
function groupLines(lines){const out=[],idx={};
  lines.forEach(l=>{const key=l.c+'|'+FMT.plain(l.t).replace(/-?\$?[\d.,]+[KMBT]?/g,'#');
    if(idx[key]!=null){const g=out[idx[key]];g.n++;const am=FMT.firstAmount(l.t);if(am&&g.amt)g.amt.value+=am.value}
    else{idx[key]=out.length;out.push({t:l.t,c:l.c,n:1,amt:FMT.firstAmount(l.t)})}});
  out.forEach(g=>{if(g.n>1&&g.amt){g.t=g.t.replace(g.amt.text,g.amt.money?fmt(g.amt.value):fmtN(g.amt.value))}});
  return out}
const MAJOR=/died at age|was fired|laid off|promoted to|LOTTERY|inherited|went bankrupt|stock market crashed|slid into a recession|was diagnosed with|sentenced|became a (millionaire|multi-millionaire|billionaire)|Achievement unlocked|Challenge (complete|failed)|welcomed a baby|left me|was arrested|ascended|delisted|lost a lawsuit|has become a real enemy|championship|was elected|won the election|I won the|went public|was born/i;

function diffSnap(a,b){const st={};['happy','health','smarts','looks'].forEach(k=>{const d=(b.stats[k]||0)-(a.stats[k]||0);if(d)st[k]=d});return{nw:Math.round(b.nw-a.nw),stats:st}}

function keyEvents(lines){return lines.filter(l=>!ROUTINE.test(FMT.plain(l.t))||MAJOR.test(FMT.plain(l.t))).map(l=>({l,s:(MAJOR.test(FMT.plain(l.t))?5:0)+(l.c?1:0)+Math.log10(Math.abs((FMT.firstAmount(l.t)||{value:1}).value)+1)/3})).filter(x=>x.s>=1).sort((a,b)=>b.s-a.s).slice(0,2).map(x=>x.l)}

const ov=$('#ov');

function sheet(title,build,opts={}){

function draw(){
  const top=stack[stack.length-1];if(!top){close();return}
  const body=document.createElement('div');body.className='sheet-b';
  let group=null;
  const api={item,sec,sub,html:s=>{group=null;const d=document.createElement('div');d.innerHTML=s;body.appendChild(d);return d},el:n=>{group=null;body.appendChild(n);return n}};
  function item(label,subt,right,fn,dis,icon){if(!group){group=document.createElement('div');group.className='group';body.appendChild(group)}
    const b=document.createElement('button');b.type='button';b.className='item';b.disabled=!!dis;
    const [ic,col]=icon||iconFor(label)||iconFor(subt)||iconFor(top.title)||['tag','blue'];
    b.innerHTML=`<span class="ico c-${col}">${svgI(ic)}</span><span class="t"><b>${label}</b>${subt?`<span>${subt}</span>`:''}</span>${right!=null?`<span class="r">${right}</span>`:''}<span class="arrow">›</span>`;
    b.onclick=()=>{if(b.disabled)return;fn()};group.appendChild(b);return b}
  function sec(t){group=null;const d=document.createElement('div');d.className='sec';d.textContent=t;body.appendChild(d)}
  function sub(t){api.html(`<p class="sub">${t}</p>`)}
  const scroll=ov.querySelector('.sheet-b');const keep=scroll&&ov.dataset.key===String(stack.length)+top.title?scroll.scrollTop:0;
  top.build(api);
  const wrap=document.createElement('div');wrap.className='sheet'+(top.event?' event':'');wrap.setAttribute('role','dialog');wrap.setAttribute('aria-modal','true');wrap.setAttribute('aria-label',top.title);
  const hd=document.createElement('div');hd.className='sheet-h';
  hd.innerHTML=`${stack.length>1&&!top.lock?'<button class="back" type="button" aria-label="Back">‹</button>':''}<h2>${esc(top.title)}</h2>${top.lock?'':'<button class="x" type="button" aria-label="Close">×</button>'}`;
  const grab=document.createElement('div');grab.className='grab';
  wrap.append(grab,hd,body);richify(wrap);ov.innerHTML='';ov.appendChild(wrap);ov.hidden=false;ov.classList.toggle('center',!!top.event);
  ov.dataset.key=String(stack.length)+top.title;body.scrollTop=keep;
  const bk=hd.querySelector('.back');if(bk)bk.onclick=()=>{stack.pop();draw()};
  const x=hd.querySelector('.x');if(x)x.onclick=close;
}

const EVX=EVT.legacy();
function rollEvents(){
  S.seen=S.seen||{};
  const ok=e=>S.age>=e.min&&S.age<=e.max&&!(e.once&&S.seen[e.id]!=null)&&!(S.seen[e.id]!=null&&S.age-S.seen[e.id]<(e.cd||5))&&(!e.cond||e.cond());
  let pool=EV.concat(EVX).filter(ok);
  const n=S.age<3?0:(C(.8)?1:0)+(C(.35)?1:0);
  let done=0;
  while(done<n&&pool.length){const e=P(pool);pool=pool.filter(x=>x!==e);if(e.w&&!C(e.w))continue;S.seen[e.id]=S.age;e.run();done++}
}

function eduOk(c){
  const e=S.edu;
  if(c.minAge&&S.age<c.minAge)return `Must be ${c.minAge} or older`;
  if(c.edu>=1&&e.level<1)return 'Needs a high school diploma';
  if(c.edu===2&&c.major&&!e.degrees.some(d=>d.includes(c.major)))return `Needs a ${c.major} degree`;
  if(c.edu===2&&!c.major&&e.level<2)return "Needs any bachelor's degree";
  if(c.edu===3&&!((e.grad||[]).includes(c.grad)))return `Needs ${c.grad==='PhD'?'a PhD':c.grad==='MBA'?'an MBA':c.grad+' school'}`;
  if(c.clean&&S.record>0)return 'Requires a clean record';
  if(c.health&&S.stats.health<c.health)return `Needs health of ${c.health}%+`;
  if(c.looks&&S.stats.looks<c.looks)return `Needs looks of ${c.looks}%+`;
  if(c.smarts&&S.stats.smarts<c.smarts)return `Needs smarts of ${c.smarts}%+`;
  return '';
}

function interview(c){
  const qs=[
    ['Why do you want this job?',['I care about the work.','I need the money.','I want your job someday.'],0],
    ['What is your biggest weakness?',['I work too hard.','I can be impatient, so I plan ahead.','Honestly, mornings.'],1],
    ['Where do you see yourself in five years?',['Leading a team here.','Running my own company.','No idea.'],0],
    ['Tell me about a time you failed.',['I never fail.','I missed a deadline once and fixed my process.','I would rather not.'],1],
    ['Why should we pick you over the others?',['I learn fast and I show up.','I am the best, obviously.','You do not have to.'],0],
    ['How do you handle a difficult coworker?',['I talk to them directly.','I ignore them.','I complain to the boss.'],0],
    ['What salary are you expecting?',['Whatever is fair for the role.','Double the posted pay.','I will work for free.'],0],
    ['Do you have any questions for us?',['What does success look like here?','When is lunch?','No.'],0],
  ];
  const [q,opts,good]=P(qs);
  popup(`Interview: ${c.ladder[0]}`,`The hiring manager leans back: “${q}”`,opts.map((o,i)=>[o,()=>{
    const score=S.stats.smarts*0.45+S.stats.looks*0.15+(i===good?38:R(0,12))+R(0,22);
    if(score>55){hire(c);L(`I was hired as ${an(S.job.title)} ${S.job.title} for ${fmt(S.job.salary)} a year${S.job.level?', thanks to my experience':''}.`,'good');st('happy',8);resume=null;then(careerMenu)}else{L(`I interviewed for ${c.ladder[0]} but did not get the job.`,'bad');st('happy',-3)}
  }]));
}

function bizYear(){
  S.biz.forEach(b=>{bz(b);
    const t=BIZ.find(x=>x.id===b.type)||{vol:1};const vol=(t.vol||1)*(b.up.stable?.6:1)*(b.manager?.8:1);
    const priceM=b.price==='premium'?1.22:b.price==='budget'?0.85:1;
    const id=idealStaff(b);const staffF=0.6+0.75*Math.min(b.staff,id)/id-0.04*Math.max(0,b.staff-id);
    const demand=ECO.bizCycle()*(0.55+b.rating/130)*staffF*(1+(Math.random()-0.5)*0.7*vol)*(1+b.marketing*0.05)*priceM*(0.8+b.morale/250)*b.revMult*b.boost;
    const scale=Math.max(1,b.baseRev/500e3);const wageM=b.wages==='low'?.85:b.wages==='high'?1.2:1;
    const rev=Math.round(b.baseRev*demand),pay=b.baseRev*BAL.biz.wageShare/id;
    const pl={rev,staff:Math.round(b.staff*pay*wageM),ops:Math.round((0.4*b.baseRev+0.6*rev)*bizCostRate(b)*b.costMult*ECO.portfolioOverhead()),
      mgr:b.manager?Math.round(Math.max(15e3,b.baseRev*0.07)):0,ins:b.insured?Math.round(b.baseRev*.02):0,interest:Math.round(b.loan*BAL.biz.loanRate)};
    let extra=0;
    if(C(.14)){const ev=P([
      ['good',()=>{b.rating=clamp(b.rating+12)},`${b.name} got a glowing review that went viral.`],
      ['bad',()=>{b.rating=clamp(b.rating-12)},`A scathing online review hurt ${b.name}.`],

function assetYear(){
  let rent=0,ptax=0;const fxSum={};
  S.assets.forEach(a=>{
    const t=ATYPE[a.type]||ATYPE.item;const g=t.cls?ECO.ret(t.cls)+R(t.g[0],t.g[1])/200:R(t.g[0],t.g[1])/100;a.value=Math.max(0,Math.round(a.value+(g>0?ECO.gain(a.value,g):a.value*g)));
    if(a.type==='house'){const pt=ECO.propertyTax(a.value);S.money-=pt;ptax+=pt}
    const up=Math.round((t.flat||0)+a.value*(t.up||0));if(up)S.money-=up;
    if(a.loan>0){const pay=Math.min(a.loan*(1+BAL.mortgage.rate),Math.round(a.price*BAL.mortgage.yearlyPayment));S.money-=pay;a.loan=Math.max(0,Math.round(a.loan*(1+BAL.mortgage.rate)-pay));if(a.loan===0)L(`I paid off the mortgage on my ${lc(a.name)}.`,'good')}
    if(a.rented){const r=landlordYear(a);ECO.earn(r);rent+=r}
    if(a.fx)Object.entries(a.fx).forEach(([k,v])=>{fxSum[k]=(fxSum[k]||0)+v});
  });
  Object.entries(fxSum).forEach(([k,v])=>st(k,Math.min(3,v)));
  if(rent)L(`My rental properties brought in ${fmt(rent)} this year.`,'good');
  if(ptax)L(`I paid ${fmt(ptax)} in property tax.`);
}
function marketYear(){
  ensureMarket();S.portBasis=S.portBasis||{};

    let np=old*(1+r);

}

function auctionRoom(id){
  const lot=S.flags.lots.find(l=>l.id===id);if(!lot)return;
  const A={price:Math.round(lot.est*0.45/100)*100,leader:null,log:[`The auctioneer opens ${lot.type==='art'?lot.name:lc(lot.name)} at ${fmt(Math.round(lot.est*0.45/100)*100)}.`],done:false,
    rivals:[0,1,2,3].slice(0,R(2,4)).map(i=>({paddle:R(11,240),max:Math.round(lot.truth*(0.55+Math.random()*0.65))})),appraised:false};
  const can=v=>lot.type==='house'?S.money>=v*0.2:S.money>=v;
  const finish=win=>{A.done=true;
    if(win){S.flags.lots=S.flags.lots.filter(l=>l!==lot);
      const a=buy(lot.type,lot.type==='house'?lot.name.replace('Foreclosed ',''):lot.name,A.price,lot.type==='house'&&S.money<A.price);
      if(a){a.value=lot.truth;A.log.push(`Sold to you for ${fmt(A.price)}! Experts now value it at ${fmt(lot.truth)}.`);
        L(lot.truth>=A.price?`It turned out to be worth ${fmt(lot.truth)}. A bargain!`:`Experts say it is only worth ${fmt(lot.truth)}. I overpaid.`,lot.truth>=A.price?'good':'bad')}}
    else{const r=A.rivals.find(x=>x.paddle===A.leader);S.flags.lots=S.flags.lots.filter(l=>l!==lot);A.log.push(r?`Sold to paddle ${r.paddle} for ${fmt(A.price)}.`:'The lot went unsold.');L(`I dropped out of the auction for ${lot.name}.`)}
    render();save();refresh()};
  const rivalsRespond=()=>{
    const live=A.rivals.filter(r=>r.max>A.price*1.04&&r.paddle!==A.leader).sort((a,b)=>b.max-a.max);
    if(!live.length){A.log.push('Going once… going twice…');finish(A.leader==='you');return}
    const r=live[0];const second=live[1]?live[1].max:A.price;
    A.price=Math.min(r.max,Math.round(Math.max(A.price*(1.04+Math.random()*0.08),Math.min(second*1.03,r.max))/100)*100);A.leader=r.paddle;
    A.log.push(`Paddle ${r.paddle} bids ${fmt(A.price)}.`);
  };
  const bid=pct=>{const v=Math.round(A.price*(1+pct)/100)*100;
    if(!can(v)){A.log.push(`You can't cover a ${fmt(v)} bid.`);refresh();return}
    A.price=v;A.leader='you';A.log.push(`You bid ${fmt(v)}.`);rivalsRespond();if(!A.done)refresh()};
  sheet('Auction',api=>{
    stack[stack.length-1].title='Lot: '+lot.name;
    api.html(`<div class="kv"><span>Estimate</span><span>${fmt(lot.est*0.8)} – ${fmt(lot.est*1.2)}</span>${A.appraised?`<span>Your appraiser says</span><span>${fmt(A.appraised[0])} – ${fmt(A.appraised[1])}</span>`:''}<span>Current bid</span><span><b>${fmt(A.price)}</b></span><span>Leading</span><span>${A.leader==='you'?'You':A.leader?'Paddle '+A.leader:'No bids yet'}</span><span>Your cash</span><span>${fmt(S.money)}</span></div>
      <div class="auclog">${A.log.slice(-5).map(t=>`<p>${esc(t)}</p>`).join('')}</div>`);
    if(A.done){api.item('Back to the auction house','',null,()=>{stack.pop();stack.pop();auctionHouse()});return}
    if(A.leader!=='you'){
      api.item('Bid','Small raise of 5%',fmt(Math.round(A.price*1.05/100)*100),()=>bid(.05));
      api.item('Raise firmly','Jump 15% to scare off rivals',fmt(Math.round(A.price*1.15/100)*100),()=>bid(.15));
      api.item('Knock-out bid','Jump 40%',fmt(Math.round(A.price*1.4/100)*100),()=>bid(.4));

function auctionSale(id){
  const a=S.assets.find(x=>x.id===id);if(!a)return;
  const sp=BAL.auctionSale.spread,vol=['art','collect','classic'].includes(a.type)?sp.volatile:sp.normal;
  const price=Math.round(a.value*(vol[0]+Math.random()*(vol[1]-vol[0]))/100)*100;
  const fee=Math.round(price*BAL.auctionSale.fee),net=price-fee-(a.loan||0);
  popup('Under the hammer',`Your ${lc(a.name)} sold for <b>${fmt(price)}</b> (valued at ${fmt(a.value)}). After the 10% auction fee${a.loan?' and paying off the mortgage':''} you receive ${fmt(net)}.`,[['Collect the money',()=>{
    S.money+=net;S.assets=S.assets.filter(x=>x!==a);L(`I sold my ${lc(a.name)} at auction for ${fmt(price)}.`,price>=a.value?'good':'bad');ECO.capGains(price-fee-(a.price||0),lc(a.name))}]]);
}

function storageAuctions(){
  if(S.flags.unitsAge!==S.age){S.flags.unitsAge=S.age;S.flags.units=[0,1,2,3].map(()=>({id:uid(),d:P(STORAGE),p:R(2,40)*50}))}

      const rival=Math.round(u.p*(1+Math.random()*2.5)/50)*50;
      popup('Storage unit',`${u.d}. Bidding opens at ${fmt(u.p)}. How far will you go?`,[[`Bid up to ${fmt(u.p*2)}`,()=>won(u.p*2)],[`Bid up to ${fmt(u.p*4)}`,()=>won(u.p*4)],['Pass',()=>{S.flags.units=S.flags.units.filter(x=>x!==u)}]]);
      function won(cap){S.flags.units=S.flags.units.filter(x=>x!==u);

        const paid=Math.max(u.p,Math.min(cap,rival+50));if(S.money<paid){L('I could not cover my storage unit bid.','bad');return}S.money-=paid;

        else{val=Math.round(paid*(0.1+Math.random()*0.9));what=P(['old mattresses and broken lamps','tax records and garden gnomes','a treadmill and fifty board games','water-damaged books','an inflatable boat with a hole'])}
        S.money+=val;L(`I won a storage unit for ${fmt(paid)}. Inside: ${what}. I sold it all for ${fmt(val)}.`,val>=paid?'good':'bad');
        note('Unit opened',`Inside: ${what}. You sold everything for ${fmt(val)}. ${val>=paid?`Profit: ${fmt(val-paid)}.`:`Loss: ${fmt(paid-val)}.`}`);}
    },S.money<u.p));
  });
}

  })));
  api.item('Ask to move up',G.rank<4?`Next: ${GANG_RANKS[G.rank+1]} · needs ${(G.rank+1)*40} respect`:'You run the family',null,act('',()=>{if(G.rank<4&&G.respect>=(G.rank+1)*40){G.rank++;L(`I was made ${GANG_RANKS[G.rank]} of ${G.name}.`,'good')}else L('The family says I have not earned it yet.')}),G.rank>=4);
  api.item('Leave the family','',null,act('',()=>{if(C(.3)){st('health',-30);L('The family did not take my leaving well.','bad')}L(`I walked away from ${G.name}.`);S.gang=null}));
});}

/* ---------- god mode ---------- */
function godMode(){sheet('God Mode',api=>{
  api.sub('Edit anything about this life. Changes apply instantly.');
  const f=document.createElement('form');
  const sl=(id,l,v,max=100)=>`<div class="field"><label for="${id}">${l}: <output id="${id}o">${v}</output></label><input type="range" id="${id}" min="0" max="${max}" value="${v}" oninput="document.getElementById('${id}o').textContent=this.value"></div>`;
  f.innerHTML=`<div class="row2"><div class="field"><label for="gfirst">First name</label><input id="gfirst" value="${esc(first())}" maxlength="20"></div><div class="field"><label for="glast">Last name</label><input id="glast" value="${esc(S.last)}" maxlength="24"></div></div>
  <div class="row2"><div class="field"><label for="gg">Gender</label><select id="gg"><option value="M"${he()?' selected':''}>Male</option><option value="F"${he()?'':' selected'}>Female</option></select></div>
  <div class="field"><label for="gmoney">Bank balance ($)</label><input id="gmoney" type="number" step="1000" value="${Math.round(S.money)}"></div></div>
  ${sl('ghappy','Happiness',S.stats.happy)}${sl('ghealth','Health',S.stats.health)}${sl('gsmarts','Smarts',S.stats.smarts)}${sl('glooks','Looks',S.stats.looks)}
  ${sl('gkarma','Karma',S.karma)}${sl('gfame','Fame',S.fame)}
  <div class="field"><label for="gfol">Followers</label><input id="gfol" type="number" min="0" value="${S.followers}"></div>
  <button class="btn primary" type="submit">Apply changes</button>`;
  f.onsubmit=e=>{e.preventDefault();const v=id=>f.querySelector('#'+id).value;
    S.name=(v('gfirst').trim()||first())+' '+(v('glast').trim()||S.last);S.last=v('glast').trim()||S.last;S.g=v('gg');
    S.money=Number(v('gmoney'))||0;['happy','health','smarts','looks'].forEach(k=>S.stats[k]=clamp(+v('g'+k)));
    S.karma=clamp(+v('gkarma'));S.fame=clamp(+v('gfame'));S.followers=Math.max(0,Math.round(+v('gfol')||0));
    L('A higher power reshaped my life.');close()};
  api.el(f);
  api.sec('Quick powers');
  api.item('Cure all illnesses',S.ill.length?S.ill.map(i=>i.n).join(', '):'You are healthy',null,act('',()=>{S.ill=[];L('My illnesses vanished overnight.','good')}),!S.ill.length);
  api.item('Walk free from prison',S.jail?`${S.jail} yrs left`:'Not in prison',null,act('',()=>{S.jail=0;L('I was mysteriously released from prison.','good')}),!S.jail);
  api.item('Wipe criminal record',`${S.record} convictions`,null,act('',()=>{S.record=0;L('My criminal record disappeared.')}),!S.record);
  api.item('Graduate instantly','Grant a degree of your choice',null,()=>sheet('Grant a degree',x=>{
    x.item('High school diploma','',null,act('',()=>{if(S.edu.level<1){S.edu.level=1;S.edu.degrees.push('High school diploma');L('I now hold a high school diploma.')}}));
    MAJORS.forEach(m=>x.item(`Bachelor's in ${m}`,'',null,act('',()=>{S.edu.level=Math.max(S.edu.level,2);S.edu.degrees.push(`Bachelor's in ${m}`);if(!S.edu.degrees.includes('High school diploma'))S.edu.degrees.unshift('High school diploma');L(`I now hold a degree in ${m}.`)})));
    GRADS.forEach(g=>x.item(g.id==='PhD'?'PhD':g.id==='MBA'?'MBA':g.id+' degree','',null,act('',()=>{S.edu.level=3;S.edu.grad=S.edu.grad||[];S.edu.grad.push(g.id);S.edu.degrees.push(g.id);if(g.need&&!S.edu.degrees.some(d=>d.includes(g.need)))S.edu.degrees.push(`Bachelor's in ${g.need}`);L(`I now hold a ${g.id} degree.`)})));}));
  api.item('Jump to any job','Skip interviews and requirements',null,()=>sheet('Pick a job',x=>CAREERS.forEach(c=>c.ladder.forEach((t,i)=>x.item(t,`Level ${i+1} of ${c.ladder.length}`,fmt(c.pay[i]),act('',()=>{if(S.age<16){L('I am too young to work.');return}hire(c,i);L(`I became ${t}.`,'good')}))))));
  api.item('Reset relationship bars to 100%','',null,act('',()=>{S.people.forEach(p=>p.bond=100);L('Everyone suddenly adores me.')}));
});}

/* ---------- time machine ---------- */
function timeMachine(fromDeath){sheet('Time Machine',api=>{
  const snaps=S.snaps.filter(s=>s.age<=S.age);
  if(!snaps.length){api.sub('Nothing to rewind to yet. Live a year first.');return}
  const left=LEG.rewindsLeft();api.sub(`Go back to the start of an earlier year. Everything after it is undone. ${left===Infinity?'Sandbox mode: unlimited rewinds.':`Rewinds left this life: <b>${left}</b> of ${LEG.rewindsPerLife()} (earn achievements for more).`}`);
  snaps.slice().reverse().forEach(s=>api.item(`Age ${s.age}`,s.age===S.age?'Start of this year':`${S.age-s.age} year${S.age-s.age>1?'s':''} ago`,null,()=>{
    if(LEG.rewindsLeft()<=0){toast('No rewinds left in this life. Earn achievements to get more.');return}const used=(S.flags.rewinds||0)+(LEG.sandbox()?0:1),ach=S.newAch,ass=S.flags.assisted,god=S.flags.godUsed;
    const keep=S.snaps.filter(x=>x.age<=s.age);const log=JSON.parse(JSON.stringify(S.log.slice(0,s.logLen||S.log.length)));if(s.lastLen!=null&&log.length)log[log.length-1].lines=log[log.length-1].lines.slice(0,s.lastLen);S=JSON.parse(JSON.stringify(s.data));S.log=log.length?log:[{age:S.age,lines:[]}];S.snaps=keep;nextId=Math.max(nextId,s.id);S.alive=true;S.final=null;S.flags.rewinds=used;S.newAch=ach;if(ass)S.flags.assisted=1;if(god)S.flags.godUsed=1;
    L('I woke up with a strange sense of déjà vu.');queue=[];close();}));
},{root:!!fromDeath});}

/* ---------- new life ---------- */
function newLifeMenu(force){
  stack=[{title:'New life',lock:!!force&&(!S||!S.alive),build:api=>{
    const f=document.createElement('form');
    f.innerHTML=`<p class="sub">Leave fields blank for a random life.</p>
    <div class="row2"><div class="field"><label for="lfirst">First name</label><input id="lfirst" maxlength="20" placeholder="Random"></div><div class="field"><label for="llast">Last name</label><input id="llast" maxlength="24" placeholder="Random"></div></div>
    <div class="row2"><div class="field"><label for="lg">Gender</label><select id="lg"><option value="">Random</option><option value="M">Male</option><option value="F">Female</option></select></div>
    <div class="field"><label for="lc">Country</label><select id="lc"><option value="">Random</option>${COUNTRIES.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
    <div class="field"><label for="lroyal">Start as</label><select id="lroyal"><option value="">Ordinary family</option><option value="royal">Royal heir</option><option value="rich">Wealthy family</option></select></div>
    <div class="field"><label for="lstats">Starting stats</label><select id="lstats"><option value="">Random</option><option value="max">All at 100% (no achievements)</option></select></div>
    <button class="btn primary" type="submit">Start life</button>`;
    f.onsubmit=e=>{e.preventDefault();const v=id=>f.querySelector('#'+id).value.trim();
      const o={first:v('lfirst')||undefined,last:v('llast')||undefined,g:v('lg')||undefined,country:v('lc')||undefined,royal:v('lroyal')==='royal'};
      if(v('lstats')==='max'){o.stats={happy:100,health:100,smarts:100,looks:100};o.assisted=1}
      queue=[];newLife(o);if(v('lroyal')==='rich'){S.people.forEach(p=>{if(['Mother','Father'].includes(p.rel))p.money=R(5,40)*1e6});L('My family is extremely wealthy.','good')}
      close()};
    api.el(f);
    api.sec('More ways to play');
    api.item('Challenge mode','Preset starts with a goal to beat',`${Object.keys(LEG.store().challenges).length}/${LEG.CHALLENGES.length} done`,challengeMenu,false,['crown','gold']);
    api.item('Achievements & settings',`${LEG.achCount()} of ${LEG.achTotal()} unlocked`,null,metaMenu,false,['star','gold']);
  }}];draw();
}
function challengeMenu(){sheet('Challenge mode',api=>{
  api.sub('Each challenge starts a new life with special conditions and a goal. Complete it to earn an achievement.');
  LEG.CHALLENGES.forEach(c=>{const done=LEG.store().challenges[c.id];api.item(esc(c.name)+(done?' <span class="pill">Done</span>':''),c.d,null,()=>popup(c.name,`${c.d}${c.deadline?` You have until age ${c.deadline}.`:''}`,[['Start this challenge',()=>then(()=>{queue=[];newLife({});LEG.startChallenge(c.id);save();render();close()})],['Not now',null]]),false,['crown','gold'])});
});}
function metaMenu(){sheet('Achievements & settings',api=>{const m=LEG.store(),n=LEG.achCount();
  api.html(`<div class="kv"><span>Achievements</span><span>${n} of ${LEG.achTotal()}</span><span>Lives played</span><span>${m.lives||0}</span><span>Richest life</span><span>${fmt(m.best.nw||0)}</span><span>Longest life</span><span>${m.best.age||0} years</span><span>God Mode</span><span>${LEG.sandbox()?'Unlimited (sandbox)':LEG.godUnlocked()?'Unlocked: once per life':`Locked (${n}/${LEG.GOD_UNLOCK} achievements)`}</span><span>Time Machine</span><span>${LEG.sandbox()?'Unlimited (sandbox)':`${LEG.rewindsPerLife()} rewind${LEG.rewindsPerLife()>1?'s':''} per life`}</span></div>`);
  api.sec('Settings');
  api.item(`Sandbox mode: ${LEG.sandbox()?'On':'Off'}`,'Unlimited God Mode and Time Machine. Lives played in sandbox mode cannot earn achievements.',null,act('',()=>{LEG.setSandbox(!LEG.sandbox());if(LEG.sandbox()&&S)S.flags.assisted=1;toast(LEG.sandbox()?'Sandbox mode is on.':'Sandbox mode is off. New lives can earn achievements again.')}),false,['star','gold']);
  api.sec('Achievements');
  LEG.ACH.forEach(([id,name,d])=>{const a=m.ach[id];api.item(esc(name)+(a?' <span class="pill">Unlocked</span>':''),a?`${d} Earned by ${esc(a.life)} at age ${a.age}.`:d,null,()=>{},!a,a?['star','gold']:['lock','blue'])});
  LEG.CHALLENGES.forEach(c=>{const a=m.ach['ch_'+c.id];api.item('Challenge: '+esc(c.name)+(a?' <span class="pill">Unlocked</span>':''),c.d,null,()=>{},!a,a?['crown','gold']:['lock','blue'])});
});}

/* ---------- wire up ---------- */
$('#tAge').onclick=()=>{if(UX.swallow())return;ageUp()};
$('#tJob').onclick=()=>{stack=[];careerMenu()};
$('#tAssets').onclick=()=>{stack=[];assetsMenu()};
$('#tPeople').onclick=()=>{stack=[];peopleMenu()};
$('#tDo').onclick=()=>{stack=[];actMenu()};
$('#bGod').onclick=()=>{stack=[];if(!S.alive){note('God Mode','This life has ended. Use the Time Machine to bring it back first.');return}
  if(!LEG.godUnlocked()){note('God Mode is locked',`Unlock God Mode by earning ${LEG.GOD_UNLOCK} achievements (you have ${LEG.achCount()}), or turn on sandbox mode in Achievements & settings.`);return}
  if(LEG.sandbox()||S.flags.godUsed){if(!LEG.sandbox()&&S.flags.godUsed){toast('You have already used God Mode in this life.');return}godMode();return}
  popup('Use God Mode?','You can use God Mode once per life. This life will then be marked as assisted and can no longer earn achievements.',[['Use it',()=>{LEG.useGod();then(godMode)}],['Not now',null]])};
$('#bMenu').onclick=()=>{stack=[];menuSheet()};
document.addEventListener('keydown',e=>{if(e.key===' '&&ov.hidden&&document.activeElement===document.body&&S&&S.alive){e.preventDefault();ageUp()}});

if(!load()){newLife();UX.welcome()}else{render();if(!S.alive)deathScreen()}
</script>
