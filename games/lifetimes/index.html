<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone column (profile card, journal timeline, stat tiles, floating dock); on wide screens a profile sidebar sits beside the journal */
:root{
  --bg:#E9EFEC; --panel:#FFFFFF; --panel2:#F4F8F6; --ink:#13201C; --muted:#5E6E68; --line:#D6E0DB;
  --jade:#0E8C6E; --jade-soft:#D4EEE5; --coral:#F0603F; --coral-ink:#FFFFFF; --gold:#C9971C;
  --good:#1F9D55; --warn:#D9911A; --bad:#D6453D; --overlay:rgba(10,20,16,.45);
  --shadow:0 1px 2px rgba(16,40,32,.06),0 10px 28px -14px rgba(16,40,32,.25);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1311; --panel:#15201D; --panel2:#111A18; --ink:#E6EFEB; --muted:#8FA39B; --line:#25332E;
  --jade:#3CC7A1; --jade-soft:#163A30; --coral:#FF7A5C; --coral-ink:#1A0B06; --gold:#E8BE4A;
  --good:#46C47A; --warn:#E8AE45; --bad:#F06B62; --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1311; --panel:#15201D; --panel2:#111A18; --ink:#E6EFEB; --muted:#8FA39B; --line:#25332E;
  --jade:#3CC7A1; --jade-soft:#163A30; --coral:#FF7A5C; --coral-ink:#1A0B06; --gold:#E8BE4A;
  --good:#46C47A; --warn:#E8AE45; --bad:#F06B62; --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
#app{max-width:600px;margin:0 auto;height:100%;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"head" "tools" "log" "stats" "nav";column-gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* profile */
.profile{grid-area:head;display:flex;align-items:center;gap:14px;padding-block:16px 10px}
.portrait{position:relative;flex:none}
.face{width:68px;height:68px;border-radius:22px;background:var(--jade-soft);overflow:hidden;box-shadow:var(--shadow)}
.face svg{display:block;width:100%;height:100%}
.face.dead{filter:grayscale(1);opacity:.65}
.agebadge{position:absolute;right:-6px;bottom:-6px;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;border:3px solid var(--bg)}
.who{min-width:0;flex:1}
.who h1{margin:0;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.royal{color:var(--gold);border-color:var(--gold)} .tag.bad{color:var(--bad);border-color:var(--bad)}
.money{text-align:right;flex:none}
.money b{display:block;font-family:var(--mono);font-size:18px;font-weight:500}
.money b.neg{color:var(--bad)}
.money small{display:block;font-size:11px;color:var(--muted);font-family:var(--mono)}
.toolbar{grid-area:tools;display:flex;gap:6px;padding-block:4px 10px;flex-wrap:nowrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.chip:hover{border-color:var(--jade);color:var(--jade)}
.chip.god{color:var(--gold)} .chip.god:hover{border-color:var(--gold);color:var(--gold)}
/* journal timeline */
#log{grid-area:log;overflow-y:auto;min-height:0;padding:8px 4px 16px 0;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){#log{scroll-behavior:auto}}
.year{position:relative;padding:0 0 14px 38px}
.year::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.year:last-child::before{display:none}
.year .dot{position:absolute;left:0;top:4px;width:28px;height:28px;border-radius:50%;background:var(--panel);border:2px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.year .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.year h3{margin:0 0 4px;font-family:var(--display);font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.year p{margin:3px 0;font-size:14.5px;padding-left:15px;position:relative}
.year p::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--line)}
.year p.good::before{background:var(--good)} .year p.bad::before{background:var(--bad)}
.year p.quiet{color:var(--muted);font-style:italic}
.year p.quiet::before{display:none}
.year.now .dot{background:var(--coral);border-color:var(--coral);color:var(--coral-ink)}
.year.now .card{border-color:var(--coral);box-shadow:var(--shadow);animation:pop .35s ease-out}
.year.now h3{color:var(--coral)}
@keyframes pop{from{transform:translateY(8px);opacity:.5}}
/* stats */
.stats{grid-area:stats;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-block:10px 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat .top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.stat svg{width:17px;height:17px;fill:none;stroke-width:2;flex:none}
.stat .num{font-family:var(--mono);font-size:16px}
.stat label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
/* sidebar (wide screens) */
.side{grid-area:side;display:none}
.side h2{font-family:var(--display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.glance{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.glance div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.glance div:last-child{border-bottom:none}
.glance span:first-child{color:var(--muted)}
.glance span:last-child{text-align:right;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* dock */
nav{grid-area:nav;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:4px;margin-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:var(--shadow)}
nav button{background:none;border:none;border-radius:16px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button:hover:not(:disabled){color:var(--jade);background:var(--panel2)}
nav button.age{justify-self:center;width:74px;height:74px;margin-top:-30px;border-radius:50%;background:var(--coral);color:var(--coral-ink);
  border:5px solid var(--bg);box-shadow:0 10px 22px -8px var(--coral);gap:0;padding:0;justify-content:center}
nav button.age:hover:not(:disabled){background:var(--coral);color:var(--coral-ink);transform:translateY(-2px)}
nav button.age b{font-family:var(--display);font-size:15px;font-weight:800;line-height:1.05}
nav button.age small{font-size:10.5px;font-weight:600;opacity:.85}
nav button:disabled{opacity:.35;cursor:not-allowed}
/* sheets */
#ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#ov.center{align-items:center;padding:16px}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column;border-radius:24px 24px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out;box-shadow:var(--shadow)}
.sheet.event{border-radius:24px;max-width:440px;padding-bottom:0;animation:zoom .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes zoom{from{transform:scale(.94);opacity:.3}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.event,.year.now .card{animation:none}.bar i{transition:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet.event .grab{display:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:10px 18px 10px}
.sheet-h h2{margin:0;flex:1;font-family:var(--display);font-size:22px;font-weight:800;text-wrap:balance}
.sheet.event .sheet-h{padding-top:20px}
.sheet.event .sheet-h h2{font-size:21px}
.sheet-h .x,.sheet-h .back{border:none;background:var(--panel2);border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1;flex:none}
.sheet-h .x:hover,.sheet-h .back:hover{background:var(--line)}
.sheet-b{overflow-y:auto;padding:4px 18px 20px}
.sub{color:var(--muted);font-size:13.5px;margin:4px 0 12px}
.group{background:var(--panel2);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:6px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:12px 14px}
.item:last-child{border-bottom:none}
.item:hover:not(:disabled){background:var(--jade-soft)}
.item:disabled{opacity:.45;cursor:not-allowed}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item .t span{display:block;font-size:12.5px;color:var(--muted)}
.item .r{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;flex:none}
.item .arrow{color:var(--muted);font-size:18px}
.sec{margin:16px 2px 6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.event-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}
.event-text{font-size:16.5px;line-height:1.5;margin:6px 0 18px}
.choices{display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:13px 16px;font-weight:600;text-align:left;width:100%}
.btn::after{content:"›";color:var(--muted);font-size:18px}
.btn:hover{border-color:var(--jade);background:var(--jade-soft)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--panel);justify-content:center}
.btn.primary::after{display:none}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}
.field input[type=range]{padding:0;accent-color:var(--jade)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--jade-soft);color:var(--jade);margin-left:6px;vertical-align:middle}
.pill.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;max-width:180px}
.mini i{display:block;height:100%}
.ribbon{font-family:var(--display);font-size:34px;font-weight:800;color:var(--coral);margin:4px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:0 12px;font-size:14px;margin:10px 0;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.kv span{padding:7px 0;border-bottom:1px solid var(--line)}
.kv span:nth-last-child(-n+2){border-bottom:none}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--mono);text-align:right}
#toast{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:var(--shadow);
  width:max-content;max-width:min(88vw,420px);text-align:center;animation:toast .25s ease-out}
@keyframes toast{from{transform:translate(-50%,10px);opacity:0}}
@media (max-width:420px){.chip{padding:6px 9px;font-size:12.5px;gap:4px}.chip svg{width:13px;height:13px}.row2{grid-template-columns:1fr}.who h1{font-size:19px}.stat label{font-size:9.5px;letter-spacing:.03em}}
@media (min-width:700px){#ov{align-items:center;padding:16px}.sheet{border-radius:24px;max-height:82%}.grab{display:none}.sheet-h{padding-top:18px}}
@media (min-width:940px){
  #app{max-width:1120px;grid-template-columns:340px minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;
    grid-template-areas:"head log" "tools log" "stats log" "side log" "nav nav"}
  .stats{grid-template-columns:1fr 1fr}
  .side{display:block;overflow-y:auto;min-height:0;padding-bottom:12px}
  #log{padding-top:18px}
  nav{width:100%;max-width:560px;justify-self:center;margin-left:184px}
  #toast{left:calc(50% + 184px)}
}
</style>

let toastT;

/* ---------- sheets ---------- */
const ov=$('#ov');
let stack=[];
function sheet(title,build,opts={}){
  if(!opts.replace&&!ov.hidden&&stack.length&&!opts.root)stack.push({title,build});else stack=[{title,build}];
  draw();
}
function draw(){
  const top=stack[stack.length-1];if(!top){close();return}
  const body=document.createElement('div');body.className='sheet-b';
  let group=null;
  const api={item,sec,sub,html:s=>{group=null;const d=document.createElement('div');d.innerHTML=s;body.appendChild(d);return d},el:n=>{group=null;body.appendChild(n);return n}};
  function item(label,subt,right,fn,dis){if(!group){group=document.createElement('div');group.className='group';body.appendChild(group)}
    const b=document.createElement('button');b.type='button';b.className='item';b.disabled=!!dis;
    b.innerHTML=`<span class="t"><b>${label}</b>${subt?`<span>${subt}</span>`:''}</span>${right!=null?`<span class="r">${right}</span>`:''}<span class="arrow">›</span>`;
    b.onclick=()=>{fn();};group.appendChild(b);return b}
  function sec(t){group=null;const d=document.createElement('div');d.className='sec';d.textContent=t;body.appendChild(d)}
  function sub(t){api.html(`<p class="sub">${t}</p>`)}
  top.build(api);
  const wrap=document.createElement('div');wrap.className='sheet'+(top.event?' event':'');wrap.setAttribute('role','dialog');wrap.setAttribute('aria-modal','true');
  const hd=document.createElement('div');hd.className='sheet-h';
  hd.innerHTML=`${stack.length>1?'<button class="back" type="button" aria-label="Back">‹</button>':''}<h2>${esc(top.title)}</h2>${top.lock?'':'<button class="x" type="button" aria-label="Close">×</button>'}`;
  const grab=document.createElement('div');grab.className='grab';
  wrap.append(grab,hd,body);ov.innerHTML='';ov.appendChild(wrap);ov.hidden=false;ov.classList.toggle('center',!!top.event);
  const bk=hd.querySelector('.back');if(bk)bk.onclick=()=>{stack.pop();draw()};
  const x=hd.querySelector('.x');if(x)x.onclick=close;
}
function refresh(){if(!ov.hidden)draw()}
function close(){ov.hidden=true;ov.innerHTML='';stack=[];render();save();}
ov.addEventListener('click',e=>{if(e.target===ov&&!(stack[stack.length-1]||{}).lock)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden&&!(stack[stack.length-1]||{}).lock)close()});

let queue=[];
function popup(title,text,choices){queue.push({title,text,choices});if(queue.length===1)showPop()}
function showPop(){
  const q=queue[0];if(!q){close();return}
  stack=[{title:q.title,lock:true,event:true,build:api=>{
    api.html(`<span class="event-tag">Age ${S.age}</span><p class="event-text">${q.text}</p>`);
    const c=document.createElement('div');c.className='choices';
    (q.choices||[['OK',()=>{}]]).forEach(([lab,fn],i)=>{const b=document.createElement('button');b.type='button';b.className='btn'+(i===0&&q.choices&&q.choices.length===1?' primary':'');b.textContent=lab;
      b.onclick=()=>{queue.shift();const before=stack[stack.length-1];fn&&fn();render();save();if(queue.length)showPop();else if(stack[stack.length-1]!==before){stack=[stack[stack.length-1]];draw()}else close()};c.appendChild(b)});
    api.el(c);
  }}];
  draw();
}
const note=(t,txt)=>popup(t,txt,[['OK',null]]);

/* ---------- age up ---------- */
function ageUp(){
  if(!S.alive)return;
  S.age++;S.acts={};
  S.log.push({age:S.age,lines:[]});
  S.people.forEach(p=>{if(p.alive){p.age++;p.bond=clamp(p.bond-R(0,4))}});
  // jail
  if(S.jail>0){S.jail--;st('happy',-R(4,10));if(S.jail===0){L('I was released from prison.','good')}else L(`Another year behind bars. ${S.jail} to go.`)}
  // education
  eduYear();
  // money in/out
  finances();
  // stats drift
  if(S.age>35)st('health',-R(0,S.age>60?4:2));
  if(S.age>45)st('looks',-R(0,2));
  if(S.age<25)st('smarts',R(0,2));
  st('happy',R(-3,3));
  S.ill.forEach(i=>{st('health',-Math.round(i.h/3));if(i.hap)st('happy',-Math.round(i.hap/3))});
  S.ill=S.ill.filter(i=>{if(i.h<=6&&C(.6)){L(`My ${i.n} cleared up on its own.`,'good');return false}return true});
  // relatives
  relativesYear();
  // pets
  S.pets.forEach(p=>{p.age++;if(p.alive&&p.age>R(10,18)){p.alive=false;L(`My ${p.kind} ${p.name} died of old age.`,'bad');st('happy',-8)}});
  // royal
  if(S.royal){if(!S.royal.monarch){S.money+=S.age>=18?250e3:0}else S.money+=4e6;S.royal.pop=clamp(S.royal.pop+R(-4,2));
    if(S.royal.monarch&&S.royal.pop<15&&C(.35)){S.royal.monarch=false;S.royal.overthrown=true;L(`A revolution in ${S.country} removed me from the throne.`,'bad');S.money=Math.floor(S.money*0.4)}}
  // gang
  if(S.gang&&S.jail===0){S.money+=[15e3,45e3,120e3,350e3,1.2e6][S.gang.rank];if(C(.06+S.gang.rank*.03)){arrest('The police raided a crew safe house and found my name in the ledgers.',R(3,12))}}
  // random events
  if(S.jail===0)rollEvents();else if(C(.25))prisonEvent();
  // death
  deathCheck();
  if(S.alive)snap();render();save();
  if(!queue.length&&S.alive)close();
}
function eduYear(){
  const a=S.age,e=S.edu;
  if(a===5&&!e.dropped)L('I started primary school.');
  if(a===11&&!e.dropped)L('I started middle school.');
  if(a===14&&!e.dropped)L('I started high school.');
  if(a>=5&&a<18&&!e.dropped)e.grades=clamp(e.grades+(S.stats.smarts-50)/12+R(-6,6));
  if(a===18&&!e.dropped&&e.level===0&&S.jail===0){
    if(e.grades<20&&C(.5)){L('I failed my final exams and did not graduate high school.','bad');e.dropped=true}
    else{e.level=1;e.degrees.push('High school diploma');L(`I graduated from high school${e.grades>85?' with honors':''}.`,'good');
      popup('Graduation day',`You finished high school with ${e.grades>80?'excellent':e.grades>55?'solid':'shaky'} grades. What now?`,[
        ['Apply to university',()=>uniMenu()],['Look for a job',()=>{L('I decided to go straight into work.')}],['Take a gap year',()=>{st('happy',8);L('I took a gap year to travel and think.')}]])}
  }
  const s=e.school;
  if(s){
    if(s.cost){S.money-=s.cost;if(s.cost>0)L(`Tuition: ${fmt(s.cost)}.`)}
    s.left--;e.grades=clamp(e.grades+(S.stats.smarts-50)/10+R(-5,5));
    if(s.left<=0){

  if(S.job&&S.jail===0)L(`I earned ${fmt(Math.round(S.job.salary*0.74))} after tax as ${S.job.title}.`);
  // living costs
  if(S.age>=18&&S.jail===0){
    const home=S.assets.some(a=>a.type==='house');
    const atHome=!home&&S.age<26&&alive().some(p=>p.rel.startsWith('Mother')||p.rel.startsWith('Father'))&&!partner();
    const live=atHome?R(1,3)*1000:home?R(9,14)*1000:R(14,22)*1000;S.money-=live;
    if(atHome&&S.age===18)L('I am still living with my parents to save money.');
    S.assets.forEach(a=>{if(a.type==='house'){a.value=Math.round(a.value*(1+R(-3,7)/100));S.money-=Math.round(a.value*0.01)}
      else if(a.type==='car'){a.value=Math.round(a.value*(0.84+Math.random()*0.04));S.money-=Math.round(800+a.value*0.02)}});
    S.pets.filter(p=>p.alive).forEach(()=>S.money-=600);
  }
  // investments
  if(S.invest>0){const r=(Math.random()*0.5-0.18);const g=Math.round(S.invest*r);S.invest+=g;L(`My investment portfolio ${g>=0?'gained':'lost'} ${fmt(Math.abs(g))}.`,g>=0?'good':'bad')}
  // businesses
  S.biz.forEach(b=>{
    const demand=(b.rating/60)*(1+b.staff*0.12)*(0.65+Math.random()*0.7)*(1+b.marketing*0.05);
    const rev=Math.round(b.baseRev*demand), cost=Math.round(b.staff*38e3+b.baseRev*0.35);
    const profit=rev-cost;b.lastProfit=profit;b.years++;S.money+=profit;
    b.rating=clamp(b.rating+R(-5,3)-(b.marketing>0?0:2));b.marketing=Math.max(0,b.marketing-1);
    b.value=Math.max(0,Math.round(b.value*0.92+Math.max(profit,0)*2.5));
    L(`${b.name} ${profit>=0?'made a profit of':'lost'} ${fmt(Math.abs(profit))} this year.`,profit>=0?'good':'bad');
  });
  for(const b of S.biz.slice()){if(b.value<5000&&b.lastProfit<0){S.biz=S.biz.filter(x=>x!==b);L(`${b.name} went bankrupt and closed down.`,'bad');st('happy',-15)}}

}

function deathCheck(){

function continueAs(k){
  const old=S;const inherit=Math.round(netWorth()/Math.max(1,old.people.filter(p=>['Son','Daughter'].includes(p.rel)&&p.alive).length+(partner()?1:0)));

}

function rollEvents(){
  const pool=EV.filter(e=>S.age>=e.min&&S.age<=e.max&&(!e.cond||e.cond()));
  let n=C(.55)?1:0;if(C(.2))n++;
  const used=new Set();
  for(let i=0;i<n&&pool.length;i++){let e=P(pool);if(used.has(e))continue;if(e.w&&!C(e.w))continue;used.add(e);e.run()}
  if(S.age===1)L('I took my first steps.');
  if(S.age===3)L(P(['I said my first full sentence.','I learned to ride a tricycle.','I drew a picture of my family.']));
}

function interview(c){
  const qs=[
    ['Why do you want this job?',['I care about the work.','I need the money.','I want your job someday.']],
    ['What is your biggest weakness?',['I work too hard.','I can be impatient.','Honestly, mornings.']],
    ['Where do you see yourself in five years?',['Leading a team here.','Running my own company.','No idea.']],
  ];
  const [q,opts]=P(qs);const good=R(0,2);
  popup(`Interview: ${c.ladder[0]}`,`The hiring manager leans back: “${q}”`,opts.map((o,i)=>[o,()=>{
    const score=S.stats.smarts*0.5+S.stats.looks*0.2+(i===good?35:R(0,15))+R(0,20);
    if(score>55){hire(c);L(`I was hired as a ${c.ladder[0]} for ${fmt(S.job.salary)} a year.`,'good');st('happy',8)}else{L(`I interviewed for ${c.ladder[0]} but did not get the job.`,'bad');st('happy',-3)}

    api.item('Attempt an escape','',null,act('',()=>{if(C(.18)){S.jail=0;L('I escaped from prison!','good')}else{S.jail+=R(1,4);L('My escape attempt failed and my sentence was extended.','bad')}}));return}
  api.sec('Mind & body');
  const train=(k,label,stat,dl,msg)=>api.item(label,'',null,act('',()=>{S.acts[k]=(S.acts[k]||0)+1;const gain=S.acts[k]>2?0:R(dl[0],dl[1]);stat.forEach(s=>st(s,gain));L(gain?msg:`I ${label.toLowerCase()} again, but it did not help much.`)}));
  if(a>=6)train('gym','Go to the gym',['health'],[3,7],'I worked out at the gym.');
  if(a>=8)train('lib','Visit the library',['smarts'],[2,5],'I spent the afternoon at the library.');
  if(a>=12)train('med','Meditate',['happy'],[3,7],'I meditated.');
  if(a>=12)api.item('Go for a run','',null,act('',()=>{st('health',R(1,4));st('looks',R(0,2));L('I went for a run.')}));
  api.item('Visit the doctor',S.ill.length?`Treat ${S.ill.map(i=>i.n).join(', ')}`:'Check-up',null,()=>doctor());
  if(adult){api.item('Cosmetic surgery','Nose, jaw, skin…',null,()=>sheet('Cosmetic surgery',x=>[['Nose job',8e3],['Jawline contouring',15e3],['Full facelift',30e3],['Skin resurfacing',3e3]].forEach(([n,c])=>x.item(n,'',fmt(c),act('',()=>{S.money-=c;if(C(.82)){st('looks',R(6,15));L(`I had a ${n.toLowerCase()}. I love the results.`,'good')}else{st('looks',-R(8,18));st('happy',-8);L(`My ${n.toLowerCase()} went badly.`,'bad')}})))));
    api.item('Go on vacation','',null,()=>sheet('Vacation',x=>[['Weekend road trip',600],['Beach resort',3500],['European tour',9000],['Luxury world cruise',60000]].forEach(([n,c])=>x.item(n,'',fmt(c),act('',()=>{S.money-=c;st('happy',Math.min(25,6+c/3000));st('health',2);L(`I went on a ${n.toLowerCase()}.`,'good')}),S.money<c))))}
  api.sec('Money & luck');
  if(adult){api.item('Buy a lottery ticket','$10',null,act('',()=>{S.money-=10;const r=Math.random();if(r<0.0004){S.money+=25e6;L('I WON THE LOTTERY JACKPOT: $25,000,000!','good');st('happy',40)}else if(r<0.02){S.money+=1000;L('I won $1,000 on a lottery ticket.','good')}else if(r<0.12){S.money+=20;L('I won $20 on a scratch ticket.')}else L('My lottery ticket was a dud.')}));
    api.item('Casino','Blackjack table',null,casino)}
  api.sec('Social');
  if(a>=13)api.item('Social media',`${S.followers.toLocaleString()} followers · fame ${S.fame}`,null,social);
  if(S.royal)api.item('Royal life',`Public approval ${S.royal.pop}%`,null,royalMenu);
  if(a>=10)api.item('Adopt a pet','',null,()=>sheet('Pet shelter',x=>PETS.forEach(([k,c])=>x.item(k[0].toUpperCase()+k.slice(1),'',fmt(c),act('',()=>{S.money-=c;const n=P(PETNAMES);S.pets.push({id:uid(),kind:k,name:n,age:R(0,3),alive:true,bond:70});L(`I adopted a ${k} named ${n}.`,'good');st('happy',8)}),S.money<c&&a>=18))));
  if(adult)api.item('Emigrate','Move to a new country · $5,000',null,()=>sheet('Emigrate',x=>COUNTRIES.filter(c=>c!==S.country).forEach(c=>x.item(c,'',null,act('',()=>{S.money-=5000;S.country=c;L(`I moved to ${c}.`,'good')})))));
  if(adult)api.item('Change my name','',null,()=>sheet('Change name',x=>{const f=document.createElement('form');f.innerHTML=`<div class="field"><label for="nfirst">First name</label><input id="nfirst" value="${esc(first())}" maxlength="20" required></div><div class="field"><label for="nlast">Last name</label><input id="nlast" value="${esc(S.last)}" maxlength="24" required></div><button class="btn primary" type="submit">Change name</button>`;f.onsubmit=e=>{e.preventDefault();const fn=f.nfirst.value.trim(),ln=f.nlast.value.trim();if(!fn||!ln)return;S.name=fn+' '+ln;S.last=ln;L(`I legally changed my name to ${S.name}.`);close()};x.el(f)}));
  if(a>=12){api.sec('Crime');api.item('Commit a crime','Shoplifting to bank jobs',null,crimeMenu);
    if(adult)api.item('Organized crime',S.gang?`${GANG_RANKS[S.gang.rank]} in ${S.gang.name}`:'Join a crime family',null,gangMenu)}
});}
function doctor(){
  if(!S.ill.length){sheet('Doctor',api=>api.item('Get a check-up','$150',null,act('',()=>{S.money-=150;st('health',R(1,4));L('I went for a check-up. The doctor says I am doing fine.')})));return}
  sheet('Doctor',api=>S.ill.forEach(i=>api.item(`Treat ${i.n}`,`Success chance about ${Math.round(i.cure*100)}%`,fmt(i.cost),act('',()=>{S.money-=i.cost;if(C(i.cure)){S.ill=S.ill.filter(x=>x!==i);st('health',Math.round(i.h*0.7));L(`I was cured of ${i.n}.`,'good')}else L(`Treatment for ${i.n} did not work this time.`,'bad')}))));
}
function casino(){sheet('Blackjack',api=>{api.sub(`You have ${fmt(S.money)}. The house wins a little more often than you do.`);
  [100,1000,10000,100000].forEach(b=>api.item(`Bet ${fmt(b)}`,'',null,()=>{
    if(S.money<b){note('Not enough cash',`You need ${fmt(b)} to place that bet.`);return}
    const you=R(15,22),deal=R(16,23);let res;
    if(you===21&&C(.4)){S.money+=Math.round(b*1.5);res=`Blackjack! You won ${fmt(b*1.5)}.`}
    else if(deal>21||you>deal){S.money+=b;res=`You had ${you}, dealer had ${deal}. You won ${fmt(b)}.`}
    else if(you===deal)res=`Push at ${you}. Bet returned.`;
    else{S.money-=b;res=`You had ${you}, dealer had ${deal}. You lost ${fmt(b)}.`}
    L('Casino: '+res.replace('You','I').replace('You','I'));note('Blackjack',res);},S.money<b))});}
function social(){sheet('Social media',api=>{
  api.html(`<div class="kv"><span>Followers</span><span>${S.followers.toLocaleString()}</span><span>Fame</span><span>${S.fame}%</span></div>`);
  [['Post a selfie','looks'],['Post a hot take','smarts'],['Post a funny video','happy'],['Go live','fame']].forEach(([t,k])=>api.item(t,'',null,act('',()=>{
    S.acts.posts=(S.acts.posts||0)+1;if(S.acts.posts>4){L('I posted too much this year. Nobody engaged.');return}
    const base=(k==='fame'?S.fame:S.stats[k])+S.fame;const viral=C(0.03+S.fame/500);
    let g=Math.round((base*R(2,15)+S.followers*R(1,6)/100)*(viral?40:1));if(C(.12)){g=-Math.round(S.followers*0.05);}
    S.followers=Math.max(0,S.followers+g);if(viral)S.fame=clamp(S.fame+R(5,15));else if(S.followers>100000)S.fame=clamp(S.fame+1);
    L(viral?`My post went viral! I gained ${g.toLocaleString()} followers.`:g>=0?`I posted online and gained ${g.toLocaleString()} followers.`:`My post flopped and I lost ${(-g).toLocaleString()} followers.`,viral?'good':g<0?'bad':'')})));
});}
function royalMenu(){sheet('Royal life',api=>{const r=S.royal;
  api.html(`<p class="sub">${r.monarch?`${he()?'King':'Queen'} of ${esc(S.country)}`:`${r.title} of ${esc(S.country)}`} · public approval ${r.pop}%</p>`);
  api.item('Carry out royal duties','Ribbon cuttings, hospital visits',null,act('',()=>{r.pop=clamp(r.pop+R(3,7));L('I carried out a full slate of royal duties.','good')}));
  api.item('Host a royal ball','Meet eligible nobility · $250,000',null,act('',()=>{S.money-=250e3;r.pop=clamp(r.pop+2);if(!partner()&&S.age>=18&&C(.6)){const g=S.flags.pref||(he()?'F':'M');const p=person('Partner',clamp(S.age+R(-5,5),18,90),g);p.name=(C(.5)?'Lord ':'Lady ').replace(g==='M'?'Lady':'Lord',g==='M'?'Lord':'Lady')+p.name;p.money=2e7;S.people.push(p);L(`I met ${p.name} at a royal ball and we began courting.`,'good')}else L('I hosted a glittering royal ball.')}));
  api.item('Go on a state visit','',null,act('',()=>{r.pop=clamp(r.pop+R(1,5));st('happy',4);L(`I made a state visit to ${P(COUNTRIES)}.`)}));
  if(r.monarch){api.item('Raise taxes','More income, less approval',null,act('',()=>{S.money+=3e6;r.pop=clamp(r.pop-12);L('I raised taxes across the kingdom.','bad')}));
    api.item('Pardon prisoners','',null,act('',()=>{r.pop=clamp(r.pop+6);S.karma=clamp(S.karma+4);L('I pardoned a group of prisoners.','good')}));
    api.item('Abdicate the throne','',null,act('',()=>{r.monarch=false;r.title='Former '+(he()?'King':'Queen');L('I abdicated the throne.','bad')}))}
});}
function arrest(text,yrs){S.record++;S.jail=yrs;if(S.job){L(`I lost my job as ${S.job.title}.`,'bad');S.job=null}L(text,'bad');L(`I was sentenced to ${yrs} year${yrs>1?'s':''} in prison.`,'bad');st('happy',-20)}
function crimeMenu(){sheet('Crime',api=>{
  api.sub('Every crime carries a chance of arrest. Bigger scores, bigger risk.');
  [['Shoplift',12,[20,300],.18,[0,1]],['Pickpocket',14,[20,600],.2,[0,1]],['Burglary',16,[500,8000],.3,[1,4]],['Steal a car',16,[3000,25000],.33,[2,5]],['Rob a jewelry store',18,[20000,200000],.45,[4,10]],['Bank heist',18,[100000,3000000],.6,[8,25]]]
  .forEach(([n,min,[lo,hi],risk,[j1,j2]])=>api.item(n,`About ${Math.round(risk*100)}% arrest risk`,null,act('',()=>{
    S.karma=clamp(S.karma-5);
    if(C(risk-S.stats.smarts/1000)){if(j1===0&&C(.6)){S.record++;L(`I was caught trying to ${n.toLowerCase()}. I got off with a warning and a record.`,'bad')}else arrest(`I was arrested trying to ${n.toLowerCase()}.`,R(Math.max(1,j1),j2))}
    else{const g=R(lo,hi);S.money+=g;L(`I pulled off a ${n.toLowerCase()} and got away with ${fmt(g)}.`,'good')}}),S.age<min));
});}
function gangMenu(){sheet('Organized crime',api=>{
  if(!S.gang){api.sub('Crime families recruit people with a reputation. Having a record helps.');
    GANGS.forEach(g=>api.item(`Approach ${g}`,'',null,act('',()=>{if(C(.25+S.record*0.15)){S.gang={name:g,rank:0,respect:10};L(`I was taken in by ${g} as an associate.`,'good')}else L(`${g} wanted nothing to do with me.`,'bad')})));return}
  const G=S.gang;api.html(`<p class="sub">${GANG_RANKS[G.rank]} in ${esc(G.name)} · respect ${G.respect}</p>`);
  [['Collect a debt',[5e3,25e3],.08,6],['Run a smuggling job',[30e3,150e3],.15,10],['Pull off a heist',[150e3,900e3],.28,18],['Muscle out a rival crew',[0,0],.2,22]].forEach(([n,[lo,hi],risk,rep])=>api.item(n,`Respect +${rep}`,null,act('',()=>{
    if(C(risk)){if(C(.5))arrest(`I was arrested on the job: ${n.toLowerCase()}.`,R(2,15));else{st('health',-R(10,25));L(`A job went wrong (${n.toLowerCase()}) and I was hurt.`,'bad')}}
    else{const g=R(lo,hi);S.money+=g;G.respect+=rep;L(`I completed a job for the family: ${n.toLowerCase()}${g?` (${fmt(g)})`:''}.`,'good')}
  })));
  api.item('Ask to move up',G.rank<4?`Next: ${GANG_RANKS[G.rank+1]} · needs ${(G.rank+1)*40} respect`:'You run the family',null,act('',()=>{if(G.rank<4&&G.respect>=(G.rank+1)*40){G.rank++;L(`I was made ${GANG_RANKS[G.rank]} of ${G.name}.`,'good')}else L('The family says I have not earned it yet.')}),G.rank>=4);
  api.item('Leave the family','',null,act('',()=>{if(C(.3)){st('health',-30);L('The family did not take my leaving well.','bad')}L(`I walked away from ${G.name}.`);S.gang=null}));
});}

/* ---------- god mode ---------- */
function godMode(){sheet('God Mode',api=>{
  api.sub('Edit anything about this life. Changes apply instantly.');
  const f=document.createElement('form');
  const sl=(id,l,v,max=100)=>`<div class="field"><label for="${id}">${l}: <output id="${id}o">${v}</output></label><input type="range" id="${id}" min="0" max="${max}" value="${v}" oninput="document.getElementById('${id}o').textContent=this.value"></div>`;
  f.innerHTML=`<div class="row2"><div class="field"><label for="gfirst">First name</label><input id="gfirst" value="${esc(first())}" maxlength="20"></div><div class="field"><label for="glast">Last name</label><input id="glast" value="${esc(S.last)}" maxlength="24"></div></div>
  <div class="row2"><div class="field"><label for="gg">Gender</label><select id="gg"><option value="M"${he()?' selected':''}>Male</option><option value="F"${he()?'':' selected'}>Female</option></select></div>
  <div class="field"><label for="gmoney">Bank balance ($)</label><input id="gmoney" type="number" step="1000" value="${Math.round(S.money)}"></div></div>
  ${sl('ghappy','Happiness',S.stats.happy)}${sl('ghealth','Health',S.stats.health)}${sl('gsmarts','Smarts',S.stats.smarts)}${sl('glooks','Looks',S.stats.looks)}
  ${sl('gkarma','Karma',S.karma)}${sl('gfame','Fame',S.fame)}
  <div class="field"><label for="gfol">Followers</label><input id="gfol" type="number" min="0" value="${S.followers}"></div>
  <button class="btn primary" type="submit">Apply changes</button>`;
  f.onsubmit=e=>{e.preventDefault();const v=id=>f.querySelector('#'+id).value;
    S.name=(v('gfirst').trim()||first())+' '+(v('glast').trim()||S.last);S.last=v('glast').trim()||S.last;S.g=v('gg');
    S.money=Number(v('gmoney'))||0;['happy','health','smarts','looks'].forEach(k=>S.stats[k]=clamp(+v('g'+k)));
    S.karma=clamp(+v('gkarma'));S.fame=clamp(+v('gfame'));S.followers=Math.max(0,Math.round(+v('gfol')||0));
    L('A higher power reshaped my life.');close()};
  api.el(f);
  api.sec('Quick powers');
  api.item('Cure all illnesses',S.ill.length?S.ill.map(i=>i.n).join(', '):'You are healthy',null,act('',()=>{S.ill=[];L('My illnesses vanished overnight.','good')}),!S.ill.length);
  api.item('Walk free from prison',S.jail?`${S.jail} yrs left`:'Not in prison',null,act('',()=>{S.jail=0;L('I was mysteriously released from prison.','good')}),!S.jail);
  api.item('Wipe criminal record',`${S.record} convictions`,null,act('',()=>{S.record=0;L('My criminal record disappeared.')}),!S.record);
  api.item('Graduate instantly','Grant a degree of your choice',null,()=>sheet('Grant a degree',x=>{
    x.item('High school diploma','',null,act('',()=>{if(S.edu.level<1){S.edu.level=1;S.edu.degrees.push('High school diploma');L('I now hold a high school diploma.')}}));
    MAJORS.forEach(m=>x.item(`Bachelor's in ${m}`,'',null,act('',()=>{S.edu.level=Math.max(S.edu.level,2);S.edu.degrees.push(`Bachelor's in ${m}`);if(!S.edu.degrees.includes('High school diploma'))S.edu.degrees.unshift('High school diploma');L(`I now hold a degree in ${m}.`)})));
    GRADS.forEach(g=>x.item(g.id==='PhD'?'PhD':g.id==='MBA'?'MBA':g.id+' degree','',null,act('',()=>{S.edu.level=3;S.edu.grad=S.edu.grad||[];S.edu.grad.push(g.id);S.edu.degrees.push(g.id);if(g.need&&!S.edu.degrees.some(d=>d.includes(g.need)))S.edu.degrees.push(`Bachelor's in ${g.need}`);L(`I now hold a ${g.id} degree.`)})));}));
  api.item('Jump to any job','Skip interviews and requirements',null,()=>sheet('Pick a job',x=>CAREERS.forEach(c=>c.ladder.forEach((t,i)=>x.item(t,`Level ${i+1} of ${c.ladder.length}`,fmt(c.pay[i]),act('',()=>{if(S.age<16){L('I am too young to work.');return}hire(c,i);L(`I became ${t}.`,'good')}))))));
  api.item('Reset relationship bars to 100%','',null,act('',()=>{S.people.forEach(p=>p.bond=100);L('Everyone suddenly adores me.')}));
});}

/* ---------- time machine ---------- */
function timeMachine(fromDeath){sheet('Time Machine',api=>{
  const snaps=S.snaps.filter(s=>s.age<=S.age);
  if(!snaps.length){api.sub('Nothing to rewind to yet. Live a year first.');return}
  api.sub('Go back to the start of an earlier year. Everything after it is undone.');
  snaps.slice().reverse().forEach(s=>api.item(`Age ${s.age}`,s.age===S.age?'Start of this year':`${S.age-s.age} year${S.age-s.age>1?'s':''} ago`,null,()=>{
    const keep=S.snaps.filter(x=>x.age<=s.age);S=JSON.parse(JSON.stringify(s.data));S.snaps=keep;nextId=Math.max(nextId,s.id);S.alive=true;
    L('I woke up with a strange sense of déjà vu.');queue=[];close();}));
},{root:!!fromDeath});}

/* ---------- new life ---------- */
function newLifeMenu(force){
  stack=[{title:'New life',lock:!!force&&(!S||!S.alive),build:api=>{
    const f=document.createElement('form');
    f.innerHTML=`<p class="sub">Leave fields blank for a random life.</p>
    <div class="row2"><div class="field"><label for="lfirst">First name</label><input id="lfirst" maxlength="20" placeholder="Random"></div><div class="field"><label for="llast">Last name</label><input id="llast" maxlength="24" placeholder="Random"></div></div>
    <div class="row2"><div class="field"><label for="lg">Gender</label><select id="lg"><option value="">Random</option><option value="M">Male</option><option value="F">Female</option></select></div>
    <div class="field"><label for="lc">Country</label><select id="lc"><option value="">Random</option>${COUNTRIES.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
    <div class="field"><label for="lroyal">Start as</label><select id="lroyal"><option value="">Ordinary family</option><option value="royal">Royal heir</option><option value="rich">Wealthy family</option></select></div>
    <div class="field"><label for="lstats">Starting stats</label><select id="lstats"><option value="">Random</option><option value="max">All at 100%</option></select></div>
    <button class="btn primary" type="submit">Start life</button>`;
    f.onsubmit=e=>{e.preventDefault();const v=id=>f.querySelector('#'+id).value.trim();
      const o={first:v('lfirst')||undefined,last:v('llast')||undefined,g:v('lg')||undefined,country:v('lc')||undefined,royal:v('lroyal')==='royal'};
      if(v('lstats')==='max')o.stats={happy:100,health:100,smarts:100,looks:100};
      queue=[];newLife(o);if(v('lroyal')==='rich'){S.people.forEach(p=>{if(['Mother','Father'].includes(p.rel))p.money=R(5,40)*1e6});L('My family is extremely wealthy.','good')}
      close()};
    api.el(f);
  }}];draw();
}

/* ---------- wire up ---------- */
$('#tAge').onclick=ageUp;
$('#tJob').onclick=()=>{stack=[];careerMenu()};
$('#tAssets').onclick=()=>{stack=[];assetsMenu()};
$('#tPeople').onclick=()=>{stack=[];peopleMenu()};
$('#tDo').onclick=()=>{stack=[];actMenu()};
$('#bGod').onclick=()=>{stack=[];if(S.alive)godMode();else note('God Mode','This life has ended. Use the Time Machine to bring it back first.')};
$('#bTime').onclick=()=>{stack=[];timeMachine()};
$('#bNew').onclick=()=>{stack=[];newLifeMenu()};
document.addEventListener('keydown',e=>{if(e.key===' '&&ov.hidden&&document.activeElement===document.body&&S&&S.alive){e.preventDefault();ageUp()}});

if(!load())newLife();else{render();if(!S.alive)deathScreen()}
</script>
