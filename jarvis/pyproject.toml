[project]
name = "jarvis-offline"
version = "0.1.0"
description = "A personal assistant that runs on your own computer with strict safety rules."
requires-python = ">=3.11"
dependencies = []   # the core uses only the Python standard library

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["expects_blocked: the test deliberately triggers the network guard"]
